# fly.toml app configuration file generated for weed-cli-red-dream-2910 on 2026-08-24T08:21:14-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'weed-cli-red-dream-2910'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile.discovery-relay'

[mounts]
  source = 'weed_relay_data'
  destination = '/data'

[http_service]
  internal_port = 9101
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
