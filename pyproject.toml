[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weed-cli"
version = "1.9.6"
description = "Censorship-resistant video PoC — discovery/hosting/download over signed relay events, a real Kademlia DHT, or a TLS-capable NAT-traversal tunnel"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["p2p", "video", "censorship-resistant", "discovery", "dht", "kademlia", "nat-traversal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: File Sharing",
  "Topic :: Internet",
]

# Core runtime: hosting/discovery/download over a relay needs btcvm (for
# ott's merkle_root) and cryptography (Ed25519 identity/signing). DHT,
# QR codes, and the viz demos are genuinely optional -- see below.
dependencies = [
  "btcvm>=1.3.7",
  "cryptography>=41.0",
]

[project.scripts]
weed = "weed:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  # e2e (tests/e2e/) drives the real web UI in a real browser -- Python
  # Playwright rather than the JS package, so `pip install -e .[dev]` is
  # the only setup step; this repo otherwise has zero npm/node_modules
  # footprint (web/ is vanilla JS, no build step -- see its own README
  # note) and introducing one just for test tooling would be a bigger
  # structural change than the tests themselves. Needs a Chromium binary
  # too -- `playwright install chromium`, or point WEED_TEST_CHROMIUM at
  # an existing one (see tests/e2e/conftest.py).
  "pytest-playwright>=0.5",
  # tests/test_dht.py imports dht.py, which imports kademlia at module
  # level -- self-referencing the dht extra (not duplicating its version
  # constraint here) means bumping kademlia's pin in one place stays
  # enough. Missing this is exactly what broke CI: `pip install -e .[dev]`
  # alone left kademlia (an otherwise-optional runtime dependency, real
  # users of plain relay/DHT-less discovery never need it) uninstalled,
  # so importing dht.py at test collection time raised ModuleNotFoundError
  # before a single test even ran.
  "weed-cli[dht]",
]
dht = [
  "kademlia>=2.2",
]
qr = [
  "qrcode>=7.4",
]
viz = [
  "matplotlib>=3.8",
]

[tool.setuptools]
# Flat modules, not a package -- matches how weed.py/shell.py/node.py
# already import each other (`import node`, not `from weed import node`).
# poc_reputation is a real runtime dependency (node.py, discovery_relay.py,
# and web_ui.py all import from it), not just a standalone demo script --
# the other poc_*.py/viz_*.py files are, and stay repo-local, run via
# `make`/`python3 poc_x.py` directly rather than installed.
py-modules = [
  "weed", "node", "shell", "discovery_relay", "tunnel_relay", "web_ui",
  "dht", "lightning_settle", "poc_reputation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
  "E501",  # line too long
  "E741",  # ambiguous variable names (l, O, I)
]
