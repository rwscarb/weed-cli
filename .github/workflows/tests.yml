name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    # tests/ minus tests/e2e/ -- no browser, no Docker, just Python + real
    # sockets/subprocesses on loopback (see tests/conftest.py). This is the
    # fast, always-on signal; e2e below is its own job so a slow browser
    # download never blocks this one's result.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .[dev]
      - run: make test

  e2e:
    # Real relay + real host + real web UI, driven through a real
    # Chromium via Python Playwright (see tests/e2e/conftest.py's own
    # docstring for why Python, not the JS package -- this repo has zero
    # npm footprint otherwise). `playwright install --with-deps` pulls in
    # both the browser binary and the OS libraries it needs to actually
    # launch headless on a bare runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .[dev]
      - run: playwright install --with-deps chromium
      # tests/e2e only, not `make test-e2e` (which deliberately also runs
      # everything the unit job above already covers, for a developer
      # wanting one local command) -- no reason to pay for that twice here.
      - run: python -m pytest tests/e2e
