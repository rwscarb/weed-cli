<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORBIT VISUALIZER</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#080808; --fg:#c0c0c4; --dim:#181818; --cyan:#5ab8e0;
  --muted:#68686e; --panel:#0d0d0e; --accent:#00ff88;
}
body {
  background:var(--bg); color:var(--fg);
  font-family:'Courier New',monospace;
  display:flex; flex-direction:column;
  height:100vh; overflow:hidden;
}
header {
  display:flex; align-items:center; gap:8px;
  padding:8px 16px;
  border-bottom:1px solid var(--dim);
  background:var(--panel);
}
header h1 { font-size:10px; letter-spacing:.22em; color:var(--cyan); opacity:.75; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
.transport { display:flex; gap:8px; align-items:center; flex-shrink:0; white-space:nowrap; }
btn, .btn {
  font-family:'Courier New',monospace; font-size:9px; letter-spacing:.10em;
  background:none; border:1px solid var(--muted); color:var(--muted);
  padding:4px 10px; cursor:pointer; transition:all .12s;
}
.btn:hover { border-color:var(--accent); color:var(--accent); }
.btn.lit { border-color:var(--accent); color:#fff; background:#00ff8818; box-shadow:0 0 7px #00ff8830; }
.preset-row { display:flex; gap:4px; flex-wrap:wrap; }
#vizSection {
  flex:1; display:flex; flex-direction:column;
  padding:10px 14px 14px; position:relative; min-height:0;
}
#vizModes { margin-bottom:8px; flex-shrink:0; }
#vizCanvas {
  image-rendering:pixelated; cursor:grab;
  width:100%; flex:1; min-height:0;
  display:block; border-radius:2px; background:#000;
}
#vizSection:fullscreen, #vizSection:-webkit-full-screen {
  background:#000; padding:8px 14px;
}
.hint { font-size:7px; color:var(--muted); opacity:.4; margin-top:5px; letter-spacing:.08em; flex-shrink:0; }
.idle-note { font-size:9px; color:var(--muted); opacity:.55; margin-bottom:8px; flex-shrink:0; }
</style>
</head>
<body>

<header>
  <h1>ORBIT VISUALIZER &nbsp;·&nbsp; {1,2,4,8,7,5}</h1>
  <div class="transport">
    <button class="btn" id="backBtn" onclick="window.parent?.postMessage('orbit:back','*')" style="opacity:0.5;padding:4px 8px">← BACK</button>
    <button id="vizFsBtn" class="btn" onclick="toggleVizFullscreen()" title="Fullscreen (F)">⛶</button>
  </div>
</header>

<div id="vizSection">
  <div class="idle-note" id="idleNote">reacts to whatever's playing in the weed player — nothing playing right now, so this is just idling</div>
  <div class="preset-row" id="vizModes">
    <button class="btn lit" data-viz="tunnel">TUNNEL</button>
    <button class="btn" data-viz="bars">BARS</button>
    <button class="btn" data-viz="mirror">MIRROR</button>
    <button class="btn" data-viz="scope">SCOPE</button>
    <button class="btn" data-viz="spiral">SPIRAL</button>
    <button class="btn" data-viz="pixels">PIXELS</button>
    <button class="btn" data-viz="ascii">ASCII</button>
  </div>
  <canvas id="vizCanvas"></canvas>
  <div class="hint">scroll·zoom &nbsp;·&nbsp; drag·pan &nbsp;·&nbsp; dbl·reset &nbsp;·&nbsp; f·fullscreen &nbsp;·&nbsp; ←/→ cycle mode (fullscreen)</div>
</div>

<script>
'use strict';
// Ported from jennie21's orbit_sequencer.html "VISUALIZER" panel -- same
// five draw modes, same math, unmodified. The only real change is where
// freqData/waveData come from: the original ran its own synth engine and
// fed an AnalyserNode from that; this has no audio engine of its own at
// all, it just renders whatever frequency/waveform snapshots the parent
// window (vue-app.js) posts to it every frame, captured from weed's own
// <video> element via a MediaElementSource + AnalyserNode created over
// there (Web Audio nodes can't cross a frame boundary, but the plain
// Uint8Array snapshots they produce post over just fine).
const STEP_HUES = [0.33,0.50,0.62,0.83,0.10,0.23];
let c60Hue = STEP_HUES[0];

let freqData = new Uint8Array(1024);
let waveData = new Uint8Array(2048);
let hasSignal = false;
const idleNote = document.getElementById('idleNote');

// PIXELS mode's source frame -- the parent samples weed's own <video>
// onto a small offscreen canvas (drawImage + getImageData) and posts
// the raw pixels here every couple of frames, since Web Audio nodes
// aren't the only thing that can't cross a frame boundary directly: an
// HTMLVideoElement can't either, and this doesn't need the real one,
// just its pixels. videoFrame stays null until the first real frame
// arrives -- readyState/videoWidth checks on the parent side mean this
// only ever gets a genuine decoded frame, never a premature black one.
let videoFrame = null;
const vpixOff = document.createElement('canvas');
const vpixOffCtx = vpixOff.getContext('2d');

window.addEventListener('message', e => {
  const msg = e.data;
  if (!msg) return;
  if (msg.type === 'orbit-audio') {
    freqData = msg.freq;
    waveData = msg.wave;
    // the feed posts a message every frame regardless of whether the
    // video is actually playing anything -- silence still "arrives," it's
    // just all near-zero -- so "a message showed up" alone can't tell
    // idle from playing. Real aggregate energy across the spectrum can.
    const energy = freqData.reduce((a, b) => a + b, 0);
    if (energy > 400 && !hasSignal) { hasSignal = true; idleNote.style.display = 'none'; }
    else if (energy <= 100 && hasSignal) { hasSignal = false; idleNote.style.display = ''; }
  } else if (msg.type === 'orbit-video') {
    if (vpixOff.width !== msg.w || vpixOff.height !== msg.h) {
      vpixOff.width = msg.w; vpixOff.height = msg.h;
    }
    videoFrame = { w: msg.w, h: msg.h, imageData: new ImageData(msg.data, msg.w, msg.h) };
  }
});

const vizCanvas = document.getElementById('vizCanvas');
const vctx = vizCanvas.getContext('2d');
const vizOff = document.createElement('canvas');
const voffCtx = vizOff.getContext('2d');
let VW=0, VH=0;
let vizPanX=0, vizPanY=0, vizUserScale=1.0, vizRot=0;
let vizMode = 'tunnel';

function resetVizNav() { vizPanX=0; vizPanY=0; vizUserScale=1.0; }

function resizeVizCanvas() {
  VW = Math.round(vizCanvas.offsetWidth * devicePixelRatio);
  VH = Math.round(vizCanvas.offsetHeight * devicePixelRatio);
  vizCanvas.width = VW; vizCanvas.height = VH;
  vizOff.width = VW; vizOff.height = VH;
}
resizeVizCanvas();
new ResizeObserver(resizeVizCanvas).observe(vizCanvas);

// Viz pan/zoom
(function(){
  let panning=false, lastX=0, lastY=0;
  vizCanvas.addEventListener('wheel', e => {
    e.preventDefault();
    vizUserScale = Math.min(Math.max(0.15, vizUserScale * (e.deltaY>0 ? 0.93 : 1.07)), 8.0);
  }, {passive:false});
  vizCanvas.addEventListener('mousedown', e => {
    if(e.button!==0) return; panning=true; lastX=e.clientX; lastY=e.clientY;
    vizCanvas.style.cursor='grabbing';
  });
  vizCanvas.addEventListener('dblclick', () => resetVizNav());
  document.addEventListener('mousemove', e => {
    if(!panning) return;
    vizPanX+=(e.clientX-lastX)*devicePixelRatio; vizPanY+=(e.clientY-lastY)*devicePixelRatio;
    lastX=e.clientX; lastY=e.clientY;
  });
  document.addEventListener('mouseup', () => { if(!panning) return; panning=false; vizCanvas.style.cursor='grab'; });
})();

// Viz mode switching
document.getElementById('vizModes').addEventListener('click', function(e){
  const btn = e.target.closest('[data-viz]'); if(!btn) return;
  vizMode = btn.dataset.viz;
  this.querySelectorAll('[data-viz]').forEach(b => b.classList.toggle('lit', b===btn));
  resetVizNav();
});

// Shared fallback for the two video-based modes (pixels/ascii) when no
// frame has arrived yet -- see videoFrame's own comment on why that can
// be true even while a video is genuinely loaded and playing.
function drawNoVideoMessage(hueBase) {
  vctx.fillStyle = `hsla(${hueBase|0},40%,55%,0.5)`;
  vctx.font = `${Math.max(10, Math.round(VH*0.04))}px 'Courier New',monospace`;
  vctx.textAlign = 'center'; vctx.textBaseline = 'middle';
  vctx.fillText('— no video playing —', VW/2, VH/2);
  vctx.textAlign = 'left'; vctx.textBaseline = 'alphabetic';
}

// Draw loop -- unchanged from orbit_sequencer.html below this point,
// same five original modes, same math, just reading freqData/waveData
// from whatever the last postMessage set instead of an AnalyserNode.
function drawViz() {
  requestAnimationFrame(drawViz);
  if (!VW || !VH) return;

  // slow independent color drift -- the original derived this from
  // which step-sequencer row was currently playing, which has no
  // equivalent here (there's no sequencer); a steady drift keeps the
  // same "the whole thing slowly shifts hue" feel without needing one.
  c60Hue = (performance.now() / 20000) % 1;
  vizRot += 0.006;

  const cx = VW/2 + vizPanX, cy = VH/2 + vizPanY;
  const maxBin = Math.floor(freqData.length * 0.70);
  const hueBase = c60Hue * 360;

  if (vizMode === 'tunnel') {
    voffCtx.clearRect(0,0,VW,VH);
    voffCtx.drawImage(vizCanvas,0,0);
    vctx.fillStyle=`hsla(${hueBase|0},70%,8%,0.10)`; vctx.fillRect(0,0,VW,VH);
    vctx.save(); vctx.globalAlpha=0.92;
    vctx.translate(cx,cy);
    vctx.scale(1.024*vizUserScale*0.004+1.018, 1.024*vizUserScale*0.004+1.018);
    vctx.rotate(0.006); vctx.translate(-cx,-cy);
    vctx.drawImage(vizOff,0,0); vctx.restore();
    const R_INNER=Math.max(4,Math.min(Math.min(VW,VH)*0.08*vizUserScale,Math.min(VW,VH)*0.35));
    const R_MAX=R_INNER*3.5;
    vctx.save(); vctx.translate(cx,cy);
    for(let i=0;i<128;i++){
      const t=i/128, angle=t*Math.PI*2-Math.PI/2+vizRot*0.15;
      const v=freqData[Math.floor(t*maxBin)]/255; if(v<0.015) continue;
      const hue=(hueBase+t*120+vizRot*8)%360;
      vctx.beginPath();
      vctx.moveTo(Math.cos(angle)*R_INNER,Math.sin(angle)*R_INNER);
      vctx.lineTo(Math.cos(angle)*(R_INNER+v*R_MAX),Math.sin(angle)*(R_INNER+v*R_MAX));
      vctx.strokeStyle=`hsla(${hue|0},100%,${62+v*30|0}%,${(0.75+v*0.25).toFixed(2)})`;
      vctx.lineWidth=1.6; vctx.stroke();
    }
    vctx.beginPath();
    for(let i=0;i<=waveData.length;i++){
      const t=i/waveData.length, angle=t*Math.PI*2-Math.PI/2+vizRot*0.15;
      const r=R_INNER+(waveData[i%waveData.length]/128-1)*R_INNER*0.55;
      i===0?vctx.moveTo(Math.cos(angle)*r,Math.sin(angle)*r):vctx.lineTo(Math.cos(angle)*r,Math.sin(angle)*r);
    }
    vctx.strokeStyle=`hsla(${hueBase|0},55%,80%,0.28)`; vctx.lineWidth=devicePixelRatio; vctx.stroke();
    vctx.restore();

  } else if (vizMode === 'bars') {
    vctx.fillStyle=`hsla(${hueBase|0},65%,6%,0.14)`; vctx.fillRect(0,0,VW,VH);
    const bw=VW/maxBin;
    for(let i=0;i<maxBin;i++){
      const v=freqData[i]/255; if(v<0.01) continue;
      const x=i*bw, h=v*VH*0.92;
      const hue=(hueBase+i/maxBin*120)%360;
      vctx.fillStyle=`hsla(${hue|0},88%,${45+v*32|0}%,${(0.55+v*0.4).toFixed(2)})`;
      vctx.fillRect(x,VH-h,Math.max(1,bw-0.5),h);
    }

  } else if (vizMode === 'mirror') {
    vctx.fillStyle=`hsla(${(hueBase+180)|0},65%,6%,0.12)`; vctx.fillRect(0,0,VW,VH);
    const bw=VW/maxBin, half=VH/2;
    for(let i=0;i<maxBin;i++){
      const v=freqData[i]/255; if(v<0.01) continue;
      const x=i*bw, h=v*half*0.95;
      const hue=(hueBase+i/maxBin*180+vizRot*20)%360;
      vctx.fillStyle=`hsla(${hue|0},90%,${48+v*30|0}%,${(0.5+v*0.45).toFixed(2)})`;
      vctx.fillRect(x,half-h,Math.max(1,bw-0.5),h*2);
    }
    vctx.beginPath();
    for(let i=0;i<waveData.length;i++){
      const x=i/waveData.length*VW;
      const y=half+(waveData[i]/128-1)*half*0.38;
      i===0?vctx.moveTo(x,y):vctx.lineTo(x,y);
    }
    vctx.strokeStyle=`hsla(${hueBase|0},55%,80%,0.35)`; vctx.lineWidth=devicePixelRatio; vctx.stroke();

  } else if (vizMode === 'scope') {
    voffCtx.clearRect(0,0,VW,VH);
    voffCtx.drawImage(vizCanvas,0,0);
    vctx.fillStyle=`hsla(${hueBase|0},70%,6%,0.10)`; vctx.fillRect(0,0,VW,VH);
    vctx.save(); vctx.globalAlpha=0.90;
    vctx.translate(cx,cy); vctx.scale(1.018,1.018); vctx.translate(-cx,-cy);
    vctx.drawImage(vizOff,0,0); vctx.restore();
    const R=Math.min(VW,VH)*0.42*vizUserScale;
    vctx.save(); vctx.translate(cx,cy);
    vctx.beginPath();
    const shift=Math.floor(waveData.length/4);
    for(let i=0;i<waveData.length;i++){
      const x=(waveData[i]/128-1)*R;
      const y=(waveData[(i+shift)%waveData.length]/128-1)*R;
      i===0?vctx.moveTo(x,y):vctx.lineTo(x,y);
    }
    vctx.strokeStyle=`hsla(${hueBase|0},80%,65%,0.70)`; vctx.lineWidth=1.2; vctx.stroke();
    vctx.restore();

  } else if (vizMode === 'spiral') {
    vctx.fillStyle=`hsla(${(hueBase+60)|0},70%,7%,0.11)`; vctx.fillRect(0,0,VW,VH);
    const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));
    const energy = freqData.slice(0, Math.floor(freqData.length * 0.55))
                           .reduce((a,b)=>a+b,0) / (freqData.length * 0.55 * 255);
    const breathe = 0.45 + energy * 1.10;
    const rMax = Math.min(VW,VH) * 0.48 * vizUserScale * breathe;
    vctx.save(); vctx.translate(cx,cy);
    for(let i=0;i<maxBin;i++){
      const t = i/maxBin;
      const r = Math.sqrt(t) * rMax;
      const angle = i * GOLDEN_ANGLE + vizRot;
      const v = freqData[i]/255;
      if (v < 0.01) continue;
      const x = Math.cos(angle)*r, y = Math.sin(angle)*r;
      const size = Math.max(0.8, v * 6 * vizUserScale);
      const hue = (hueBase + t*200 + vizRot*40) % 360;
      vctx.beginPath();
      vctx.arc(x,y,size,0,Math.PI*2);
      vctx.fillStyle=`hsla(${hue|0},90%,${48+v*30|0}%,${(0.35+v*0.60).toFixed(2)})`;
      vctx.fill();
    }
    vctx.restore();

  } else if (vizMode === 'pixels') {
    vctx.fillStyle = '#000'; vctx.fillRect(0,0,VW,VH);
    if (!videoFrame) {
      drawNoVideoMessage(hueBase);
    } else {
      // putImageData paints the low-res sample 1:1; the actual scale-up
      // to fill the canvas happens in the drawImage below, with
      // smoothing off, so it reads as a chunky mosaic instead of a
      // blurred re-scale of a small image
      vpixOffCtx.putImageData(videoFrame.imageData, 0, 0);
      vctx.imageSmoothingEnabled = false;
      const dw = VW * vizUserScale, dh = VH * vizUserScale;
      vctx.drawImage(vpixOff, 0, 0, videoFrame.w, videoFrame.h, cx-dw/2, cy-dh/2, dw, dh);
      vctx.imageSmoothingEnabled = true;
      // a ring of audio-reactive glow dots around the mosaic -- same
      // per-bin language bars/spiral already use, so this still reads
      // as part of the same family instead of just being a video window
      const R = Math.min(VW,VH) * 0.46 * vizUserScale;
      for (let i=0;i<48;i++){
        const t = i/48;
        const v = freqData[Math.floor(t*maxBin)]/255;
        if (v < 0.12) continue;
        const angle = t*Math.PI*2 + vizRot;
        const x = cx+Math.cos(angle)*R, y = cy+Math.sin(angle)*R;
        const hue = (hueBase + t*200) % 360;
        vctx.beginPath();
        vctx.arc(x,y,2+v*5,0,Math.PI*2);
        vctx.fillStyle=`hsla(${hue|0},95%,65%,${(0.3+v*0.5).toFixed(2)})`;
        vctx.fill();
      }
    }

  } else if (vizMode === 'ascii') {
    vctx.fillStyle = '#000'; vctx.fillRect(0,0,VW,VH);
    if (!videoFrame) {
      drawNoVideoMessage(hueBase);
    } else {
      // Classic sparse->dense brightness ramp. Sampled at every other
      // source pixel (32x18 out of the underlying 64x36), not every
      // one -- a real ASCII-art grid is chunkier than its source image
      // by nature (each cell is a whole character, much wider than a
      // pixel), and it keeps this to ~500-600 fillText calls/frame
      // instead of ~2300, which matters since canvas text is one of
      // the more expensive things to draw a lot of, every frame.
      const RAMP = ' .:-=+*#%@';
      const STRIDE = 2;
      const cols = Math.floor(videoFrame.w / STRIDE);
      const rows = Math.floor(videoFrame.h / STRIDE);
      const cellW = (VW * vizUserScale) / cols;
      const cellH = (VH * vizUserScale) / rows;
      const ox = cx - (VW * vizUserScale) / 2;
      const oy = cy - (VH * vizUserScale) / 2;
      const px = videoFrame.imageData.data;
      vctx.font = `${Math.max(4, cellH * 1.15).toFixed(1)}px 'Courier New',monospace`;
      vctx.textAlign = 'center'; vctx.textBaseline = 'middle';
      for (let y=0; y<rows; y++) {
        for (let x=0; x<cols; x++) {
          const i = ((y*STRIDE)*videoFrame.w + (x*STRIDE)) * 4;
          const r=px[i], g=px[i+1], b=px[i+2];
          const bright = (r*0.299 + g*0.587 + b*0.114) / 255;
          if (bright < 0.03) continue; // near-black cells stay empty, same as real ASCII art leaving blanks
          const ch = RAMP[Math.min(RAMP.length-1, Math.floor(bright * RAMP.length))];
          // audio nudges brightness/alpha per column, same "ties into
          // the same bin data every other mode reacts to" as pixels'
          // glow ring above, just woven directly into the characters
          // here instead of a separate overlay
          const v = freqData[Math.floor((x/cols)*maxBin)] / 255;
          const alpha = Math.min(1, 0.55 + bright*0.3 + v*0.25);
          vctx.fillStyle = `rgba(${r},${g},${b},${alpha.toFixed(2)})`;
          vctx.fillText(ch, ox + x*cellW + cellW/2, oy + y*cellH + cellH/2);
        }
      }
      vctx.textAlign = 'left'; vctx.textBaseline = 'alphabetic';
    }
  }
}
drawViz();

// Fullscreen
const vizSection = document.getElementById('vizSection');
function toggleVizFullscreen() {
  if (!document.fullscreenElement) {
    (vizSection.requestFullscreen || vizSection.webkitRequestFullscreen).call(vizSection);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
}
document.addEventListener('fullscreenchange', () => {
  resizeVizCanvas();
  const btn = document.getElementById('vizFsBtn');
  if (btn) btn.textContent = document.fullscreenElement ? '✕' : '⛶';
});
document.addEventListener('keydown', function(e) {
  if (e.code === 'KeyF') toggleVizFullscreen();
  if (document.fullscreenElement && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) {
    e.preventDefault();
    const modes = ['tunnel','bars','mirror','scope','spiral','pixels','ascii'];
    const idx = modes.indexOf(vizMode);
    vizMode = modes[(idx + (e.code === 'ArrowRight' ? 1 : -1) + modes.length) % modes.length];
    document.querySelectorAll('[data-viz]').forEach(b => b.classList.toggle('lit', b.dataset.viz === vizMode));
    resetVizNav();
  }
});
</script>
</body>
</html>
