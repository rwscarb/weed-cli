# A weed node + its local control UI (see Dockerfile.node), plus its own
# local discovery relay (see Dockerfile.discovery-relay) so `make node` is
# self-sufficient -- hosting/discovering used to silently need a relay
# running *somewhere* first (either this repo's public one, or your own,
# started by hand in a second terminal), which is exactly the trap:
# nothing here fails loudly if none exists, a host just reports
# status: running with zero real announcements ever reaching anywhere
# (see node.py's post_event -- an unreachable relay is routine, not
# exceptional, by design). Separate file from docker-compose.yml on
# purpose -- that one is the holder/relay/verifier network-challenge
# demo, unrelated services with unrelated lifecycles.
#
# Run:
#   docker compose -f docker-compose.node.yml up --build
#   open http://127.0.0.1:8080
#
# node-data/relay-data are named volumes, not bind mounts, so identity/
# reputation/library/downloads (see Dockerfile.node's HOME=/data comment)
# and the relay's own published events survive `docker compose down` and
# only go away on an explicit `docker volume rm` or `down -v`.
#
# /share is a bind mount, not a named volume, on purpose -- you want the
# actual .ott archives you're hosting to be real files on the host you can
# see/add/remove directly, not hidden inside Docker's volume storage.
# Defaults to ./share, next to this compose file (created empty on first
# run if missing) -- NOT /share on the host itself: an absolute host path
# default silently bind-mounts whatever unrelated (usually empty)
# directory happens to live at /share on your machine, which is exactly
# the bug this comment used to have (real incident: archive_dir pointed
# at /share in the container, but the actual .ott/ lived in this repo's
# own ./share, and the container never saw it -- "no .ott/manifest.jsonl
# in /share" despite the file genuinely existing on the host). Override
# with WEED_SHARE_DIR to point at anywhere else, e.g.
#   WEED_SHARE_DIR=~/Movies docker compose -f docker-compose.node.yml up
# Then in the web UI's host form, use /share (or a subdirectory of it) as
# the archive dir -- that's this same host directory, from inside the
# container.

services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile.discovery-relay
    # host networking so 127.0.0.1:9101 is reachable from the node
    # container (also on host mode) -- Docker's bridge NAT rules don't
    # apply to loopback traffic, so the published port isn't accessible
    # via 127.0.0.1 from a host-mode container without this.
    network_mode: host
    volumes:
      - relay-data:/data
    restart: unless-stopped

  node:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        # computed by `make node` (see Makefile) from wherever it's
        # actually run, not hardcoded here -- see Dockerfile.node's own
        # comment on this arg for why the container can't compute it itself
        GIT_COMMIT: ${GIT_COMMIT:-}
    depends_on:
      - relay
    # host networking lets UDP multicast packets reach the LAN (bridge
    # networking traps them inside Docker's virtual switch). The relay
    # port (9101) is still reachable because the relay publishes it to
    # the host -- WEED_RELAY below uses 127.0.0.1 instead of the
    # bridge-only "relay" DNS name which no longer resolves in host mode.
    network_mode: host
    ports:
      - "8080:8080"
    volumes:
      - node-data:/data
      - ${WEED_SHARE_DIR:-./share}:/share
    env_file:
      # .env isn't committed (see .gitignore) -- a plain `env_file: .env`
      # here means `docker compose ... up` hard-fails on a fresh checkout
      # with no .env yet ("env file .env not found"), before ever getting
      # anywhere near "self-sufficient, works out of the box" (see this
      # file's own top comment). required: false makes "no .env" the same
      # as "an empty one" -- the environment: defaults below still apply.
      - path: .env
        required: false
    environment:
      # env_file above injects whatever .env sets, verbatim -- it has no
      # way to know "unset" should mean something *different* here than
      # it does for the bare CLI (127.0.0.1:9101, node.py's own built-in
      # default -- correct outside Docker, but this container's own
      # loopback, nothing, from in here). `environment:` entries always
      # win over env_file for the same key, so a real WEED_RELAY/
      # WEED_TUNNEL in .env still overrides this; this only fills in the
      # container-appropriate default for whichever one .env leaves unset.
      # 127.0.0.1 (not "relay") because network_mode: host means the
      # container shares the host's network namespace -- Docker's bridge
      # DNS doesn't exist there, but the relay's published port does.
      WEED_RELAY: ${WEED_RELAY:-http://127.0.0.1:9101}
      WEED_TUNNEL: ${WEED_TUNNEL:-}
      # optional: set in .env to put the web UI behind a token (see
      # web_ui.py's AUTH_TOKEN) -- worth doing, since this container
      # binds the UI on every interface of the host's network namespace
      WEED_UI_TOKEN: ${WEED_UI_TOKEN:-}
      # optional guest tier (needs WEED_UI_TOKEN): the party view only
      WEED_STREAM_TOKEN: ${WEED_STREAM_TOKEN:-}
      # optional: a plain-HTTP port serving only the stream endpoints,
      # for players that can't do self-signed TLS (Roku IP-camera
      # viewers, smart TVs) -- see web_ui.py's STREAM_PLAIN_PORT
      WEED_STREAM_PLAIN_PORT: ${WEED_STREAM_PLAIN_PORT:-}
    restart: unless-stopped

volumes:
  node-data:
  relay-data:
